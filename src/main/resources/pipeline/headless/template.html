<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  /* Tema sempre claro — o snapshot vai pro histórico de PRs, lido fora do
     IntelliJ, então não faz sentido herdar tema nenhum (nem existia um
     __THEME__ aqui antes; o template já era hardcoded nessas cores). */
  :root {
    --bg: #ffffff;
    --bg-subtle: #f7f8fa;
    --border: #d8dae0;
    --border-subtle: #eceef1;
    --text: #27282e;
    --text-secondary: #494b57;
    --text-tertiary: #8a8e99;
    --panel-bg: #f7f8fa;
  }
  html, body {
    margin: 0; width: 1400px; height: 820px; overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text);
  }
  #app { display: flex; width: 1400px; height: 820px; background: var(--bg); }

  #map-col { flex: 1; position: relative; overflow: hidden; background: var(--bg); min-width: 0; }
  svg { width: 100%; height: 100%; display: block; }

  #legend {
    position: absolute; top: 8px; left: 8px; font-size: 12px; color: var(--text-secondary);
    background: rgba(255,255,255,0.9); border: 1px solid var(--border-subtle);
    padding: 6px 10px; border-radius: 4px; pointer-events: none; line-height: 1.6;
  }
  #legend .hint { margin-bottom: 4px; }
  #legend .encoding { margin-bottom: 2px; font-weight: bold; color: var(--text); }
  #legend .swatches { margin-bottom: 4px; }
  #legend .swatches span { display: inline-flex; align-items: center; margin-right: 10px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  #legend i.ring-sample { background: #fff; border: 3px solid #FF6B00; }
  #legend .viridis-gradient {
    width: 160px; height: 10px; border-radius: 3px; margin: 2px 0 4px;
    background: linear-gradient(to right, #440154, #31688E, #35B779, #90D743, #FDE725);
  }

  .node-label { font: 10px sans-serif; pointer-events: none; text-anchor: middle; }

  /* Painel de métricas (coluna direita) — o conteúdo interno é gerado por
     buildMetaPanel() com estilo inline (mais simples que criar uma dúzia
     de classes CSS pra um painel que só é montado uma vez, num script). */
  #meta-panel {
    width: 260px; flex: none; border-left: 1px solid var(--border);
    background: var(--panel-bg); display: flex; flex-direction: column;
    padding: 0; overflow: hidden;
  }
</style>
</head>
<body>
<div id="app">
  <div id="map-col">
    <div id="legend">
      <div class="encoding">Cor — fan-out (roxo = baixo · amarelo = alto)</div>
      <div class="viridis-gradient"></div>
      <div class="encoding">Tamanho — linhas de código (LOC)</div>
      <div class="swatches">
        <span><i class="ring-sample"></i>Fan-in (anel = proporção do máximo)</span>
      </div>
    </div>
    <svg id="chart"></svg>
  </div>
  <div id="meta-panel"></div>
</div>
<script>
  const GRAPH_DATA = __GRAPH_DATA__;
  const SNAPSHOT_META = __SNAPSHOT_META__;
</script>
<script>
(function () {
  const data = GRAPH_DATA;
  const width = 928, height = 928;

  // Só a renderização estática do circle packing — sem clique/hover/zoom
  // animado: o Puppeteer tira UM screenshot logo após o load e nunca
  // interage com a página, então essa lógica (herdada do template do
  // plugin) nunca rodava de verdade aqui. Removida junto com o antigo
  // #sidebar interativo, agora substituído pelo #meta-panel estático.
  const PACKAGE_FILL = "#F0F2F4";
  const PACKAGE_STROKE = "#AAAAAA";

  const colorScale = d3.scaleSequential()
      .domain([0, GRAPH_DATA.maxFanOut || 1])
      .interpolator(d3.interpolateViridis);

  const root = d3.pack()
      .size([width, height])
      .padding(d => Math.max(10, 32 - d.depth * 6))
    (d3.hierarchy(data)
      .sum(d => d.value || 0)
      .sort((a, b) => (b.value || 0) - (a.value || 0)));

  const svg = d3.select("#chart")
      .attr("viewBox", `-${width / 2} -${height / 2} ${width} ${height}`);

  const g = svg.append("g");

  const RING_STROKE_WIDTH_MAX = 6;
  const RING_COLOR = "#FF6B00";

  let k = 1;

  function fanInRatio(d) {
    const max = GRAPH_DATA.maxFanIn || 0;
    return max > 0 ? d.data.fanIn / max : 0;
  }

  function ringStrokeWidth(d) { return Math.min(RING_STROKE_WIDTH_MAX, Math.max(2.5, d.r * k * 0.25)); }

  const nodeGroup = g.append("g")
    .selectAll("g")
    .data(root.descendants().slice(1))
    .join("g");

  const node = nodeGroup.append("circle")
      .attr("fill", d => d.children ? PACKAGE_FILL : colorScale(d.data.fanOut))
      .attr("fill-opacity", d => d.children ? 0.85 : 0.9)
      .attr("stroke", d => d.children ? PACKAGE_STROKE : d3.color(colorScale(d.data.fanOut)).darker(1.5))
      .attr("stroke-width", 1)
      .attr("stroke-opacity", d => d.children ? 0.6 : 1);

  const ring = nodeGroup
    .filter(d => !d.children && fanInRatio(d) > 0)
    .append("circle")
      .attr("class", "fanin-ring")
      .attr("fill", "none")
      .attr("stroke", RING_COLOR)
      .attr("stroke-linecap", "round")
      .attr("pointer-events", "none")
      .attr("pathLength", 100)
      .attr("stroke-dasharray", d => `${fanInRatio(d) * 100} ${100 - fanInRatio(d) * 100}`)
      .attr("transform", "rotate(-90)");

  const label = g.append("g")
      .attr("pointer-events", "none")
    .selectAll("text")
    .data(root.descendants())
    .join("text")
      .attr("class", "node-label")
      .style("fill-opacity", d => d.parent === root ? 1 : 0)
      .style("display", d => d.parent === root ? "inline" : "none")
      .text(d => d.data.name);

  zoomTo([root.x, root.y, root.r * 2]);
  buildMetaPanel();

  function zoomTo(v) {
    k = width / v[2];
    label.attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`);
    nodeGroup.attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`);
    node.attr("r", d => d.r * k);
    ring.attr("r", d => d.r * k);
    ring.attr("stroke-width", d => ringStrokeWidth(d));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function buildMetaPanel() {
    const leaves = root.leaves();
    const maxFanIn  = GRAPH_DATA.maxFanIn  || 0;
    const maxFanOut = GRAPH_DATA.maxFanOut || 0;
    const maxLoc    = GRAPH_DATA.maxLoc    || 0;

    const topFanIn = [...leaves]
      .sort((a, b) => b.data.fanIn - a.data.fanIn)
      .slice(0, 3);

    const topFanOut = [...leaves]
      .sort((a, b) => b.data.fanOut - a.data.fanOut)
      .slice(0, 3);

    const totalEdges = (GRAPH_DATA.edges || []).length;
    const totalCycles = (GRAPH_DATA.cycles || []).length;
    const totalPackages = root.descendants().filter(d => d.children && d !== root).length;

    const module = SNAPSHOT_META && SNAPSHOT_META.module || "";
    const date = SNAPSHOT_META && SNAPSHOT_META.date || "";
    const commit = SNAPSHOT_META && SNAPSHOT_META.commit || "";
    const branch = SNAPSHOT_META && SNAPSHOT_META.branch || "";

    const panel = document.getElementById('meta-panel');
    panel.innerHTML = `
        <div style="
            padding: 16px 18px 14px;
            border-bottom: 1px solid #d8dae0;
        ">
            <div style="font:600 13px/1 'IBM Plex Sans';color:#27282e;
                        margin-bottom:10px">
                CodeExplorer
            </div>
            ${module ? `
            <div style="font:500 12px 'IBM Plex Mono';color:#27282e;
                        margin-bottom:3px">
                ${escapeHtml(module)}
            </div>` : ''}
            <div style="font:400 10.5px 'IBM Plex Mono';color:#8a8e99">
                ${escapeHtml(date)}${commit ? ' · ' + escapeHtml(commit) : ''}
            </div>
            ${branch ? `
            <div style="font:400 10px 'IBM Plex Mono';color:#8a8e99;
                        margin-top:2px">
                ${escapeHtml(branch)}
            </div>` : ''}
        </div>

        <div style="padding:14px 18px;border-bottom:1px solid #d8dae0">
            ${metricRow('Classes',   leaves.length)}
            ${metricRow('Pacotes',   totalPackages)}
            ${metricRow('Relações',  totalEdges)}
            ${metricRow('Ciclos',    totalCycles,
                totalCycles > 0 ? '#c0392f' : undefined)}
        </div>

        <div style="padding:14px 18px;border-bottom:1px solid #d8dae0">
            ${metricRow('Fan-out máx', maxFanOut)}
            ${metricRow('Fan-in máx',  maxFanIn)}
            ${metricRow('LOC máx',     maxLoc)}
        </div>

        <div style="padding:14px 18px;border-bottom:1px solid #d8dae0">
            <div style="font:500 9.5px 'IBM Plex Sans';letter-spacing:.09em;
                        text-transform:uppercase;color:#8a8e99;
                        margin-bottom:10px">
                Top fan-in
            </div>
            ${topFanIn.map((d, i) => rankRow(i + 1, d.data.name,
                d.data.fanIn, '#e0701f')).join('')}
        </div>

        <div style="padding:14px 18px">
            <div style="font:500 9.5px 'IBM Plex Sans';letter-spacing:.09em;
                        text-transform:uppercase;color:#8a8e99;
                        margin-bottom:10px">
                Top fan-out
            </div>
            ${topFanOut.map((d, i) => rankRow(i + 1, d.data.name,
                d.data.fanOut, '#3574f0')).join('')}
        </div>
    `;
  }

  function metricRow(label, value, color) {
    return `
        <div style="display:flex;justify-content:space-between;
                    align-items:baseline;margin-bottom:7px">
            <span style="font:400 11.5px 'IBM Plex Sans';color:#494b57">
                ${escapeHtml(label)}
            </span>
            <span style="font:600 13px 'IBM Plex Mono';
                         color:${color || '#27282e'}">
                ${value}
            </span>
        </div>`;
  }

  function rankRow(rank, name, value, color) {
    return `
        <div style="display:flex;align-items:center;gap:8px;
                    margin-bottom:6px">
            <span style="font:400 10px 'IBM Plex Mono';color:#8a8e99;
                         width:12px">${rank}.</span>
            <span style="font:400 11px 'IBM Plex Mono';color:#494b57;
                         flex:1;overflow:hidden;text-overflow:ellipsis;
                         white-space:nowrap">
                ${escapeHtml(name)}
            </span>
            <span style="font:600 11px 'IBM Plex Mono';color:${color}">
                ${value}
            </span>
        </div>`;
  }
})();
</script>
</body>
</html>
